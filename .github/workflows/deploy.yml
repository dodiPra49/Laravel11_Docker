name: Deploy Laravel Docker to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy Application to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "🚀 Ensuring project directory exists on VPS..."
            if [ ! -d "${{ secrets.TARGET_DIR }}" ]; then
              echo "📂 Directory missing. Creating ${{ secrets.TARGET_DIR }} and cloning repository..."
              mkdir -p ${{ secrets.TARGET_DIR }}
              git clone https://github.com/dodiPra49/Laravel11_Docker.git ${{ secrets.TARGET_DIR }}
            fi

            cd ${{ secrets.TARGET_DIR }} || exit 1

            echo "📥 Pulling latest changes from GitHub..."
            git pull origin main

            if [ ! -f ".env" ]; then
              echo "📝 Creating initial .env file..."
              cp .env.example .env
            fi

            echo "🌐 Setting APP_URL & MySQL DB configuration..."
            sed -i 's|^#\?\s*APP_URL=.*|APP_URL=http://${{ secrets.VPS_HOST }}:8080|g' .env
            sed -i 's|^#\?\s*DB_CONNECTION=.*|DB_CONNECTION=mysql|g' .env
            sed -i 's|^#\?\s*DB_HOST=.*|DB_HOST=db|g' .env
            sed -i 's|^#\?\s*DB_PORT=.*|DB_PORT=3306|g' .env
            sed -i 's|^#\?\s*DB_DATABASE=.*|DB_DATABASE=laravel|g' .env
            sed -i 's|^#\?\s*DB_USERNAME=.*|DB_USERNAME=laravel|g' .env
            sed -i 's|^#\?\s*DB_PASSWORD=.*|DB_PASSWORD=root|g' .env

            echo "🐳 Restarting Docker containers cleanly..."
            docker compose down --remove-orphans
            docker compose up -d --build
            echo "⏳ Waiting 15 seconds for MySQL container to initialize..."
            sleep 15

            echo "📦 Installing Composer dependencies inside container..."
            docker compose exec -T app composer install --optimize-autoloader --no-dev

            echo "🔒 Setting storage and database permissions..."
            docker compose exec -T app mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs bootstrap/cache
            docker compose exec -T app chmod -R 777 storage bootstrap/cache database

            echo "⚡ Running Laravel optimizations & migrations..."
            docker compose exec -T app php artisan key:generate --force
            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache

            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"
